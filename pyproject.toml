[project]
name = "forgeai"
version = "1.0.0"
description = "ForgeAI Gateway"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.5.0",
    "redis>=5.0.0",
    "celery>=5.4.0"
]

[tool.vercel]
entrypoint = "backend.gateway.main:app"
